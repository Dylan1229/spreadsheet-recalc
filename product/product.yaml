_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Work out a small spreadsheet's formulas by hand, checked exactly"
summary: "Pick one of ten small invented workbooks, such as a trip budget, an invoice or a gradebook, and name the cells you want. The agent reads every cell, evaluates the formulas under rules modelled on Excel, and saves each value: a number, text, TRUE or FALSE, an empty cell, or an error such as #DIV/0!. Every value is checked against an exact recalculation."
highlights:
  - "Exact arithmetic: 1/3 stays 1/3 and rounding halves really are halves"
  - "Excel-style precedence, coercion and errors, written out rule by rule"
  - "Circular references are found before anything is evaluated, so the answer never depends on order"
steps:
  - "Choose a workbook and up to eight cells"
  - "The agent reads the sheet and evaluates each cell"
  - "The values are saved in your workspace"
  - "Each value is checked against an exact recalculation"
